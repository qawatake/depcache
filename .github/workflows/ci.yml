name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # 週次で main を検査する。commit がない期間でも `npm audit` が新しい advisory を拾えるようにするため
  # (Dependabot は親 package が exact pin する transitive 依存の advisory を PR にできないことがある)。
  # 土曜 03:00 JST = 金曜 18:00 UTC。Dependabot (土曜 03:00 JST) と同じタイミングにそろえる。
  schedule:
    - cron: "0 18 * * 5"

permissions:
  contents: read

jobs:
  test-typescript:
    name: TypeScript Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install Dependencies
        id: npm-ci
        run: npm ci

      # 全 action が commit SHA に pin されているか (tag 参照を新しく足すと落ちる)
      - name: Check actions are pinned
        id: check-actions-pinned
        run: node scripts/check-actions-pinned.mjs

      # 既知脆弱性は high 以上で止める
      - name: Audit
        id: npm-audit
        run: npm audit --audit-level=high

      - name: Format && Lint
        id: npm-check
        run: npm run check

      # - name: Test
      #   id: npm-ci-test
      #   run: npm run ci-test

  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # require to delete cache

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          dependency-path: ./package.json
          path: ~/.cache/
          skip-save: ${{ github.ref != 'refs/heads/main' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - run:
          mkdir -p ~/.cache/depcache && echo hello > ~/.cache/depcache/hello.txt

  multi-line-path:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write # require to delete cache
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test Local Action
        id: test-action
        uses: ./
        with:
          dependency-path: ./package.json
          path: |
            ~/.cache/
            ~/.cache2/
          skip-save: false
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: check cache
        if: ${{ steps.test-action.outputs.cache-hit == true }}
        run: |
          if [[ $(cat ~/.cache/depcache/hello.txt) != "hello" ]]; then
            echo "hello.txt is not hello"
            exit 1
          fi
          if [[ $(cat ~/.cache2/depcache/bye.txt) != "bye" ]]; then
            echo "bye.txt is not bye"
            exit 1
          fi
      - run: |
          mkdir -p ~/.cache/depcache && echo hello > ~/.cache/depcache/hello.txt
          mkdir -p ~/.cache2/depcache && echo bye > ~/.cache2/depcache/bye.txt
