version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Security updates bypass cooldown and arrive as soon as an advisory is published.
    # Version updates wait for a release to age: patches barely (they rarely break, and
    # batching them only grows the diff), minors until they have matured.
    cooldown:
      semver-patch-days: 7
      semver-minor-days: 30
      semver-major-days: 60
    groups:
      actions-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    # Security updates bypass cooldown and arrive as soon as an advisory is published.
    # Version updates wait for a release to age: patches barely (they rarely break, and
    # batching them only grows the diff), minors until they have matured.
    cooldown:
      semver-patch-days: 7
      semver-minor-days: 30
      semver-major-days: 60
    groups:
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch
      npm-production:
        dependency-type: production
        update-types:
          - patch
    ignore:
      # TypeScript 7.0 has no stable compiler API. Reconsider from 7.1 onward.
      - dependency-name: typescript
        versions:
          - 7.0.x
      # Keep Node.js types aligned with the Node 24 GitHub Actions runtime.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
      # Jest is not currently exercised by tests or CI. Reconsider its next major
      # together with the test setup, or remove the unused toolchain.
      - dependency-name: jest
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@jest/globals"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/jest"
        update-types:
          - "version-update:semver-major"
