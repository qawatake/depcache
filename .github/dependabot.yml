version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: Asia/Tokyo
    # github-actions does not support per-semver cooldown (semver-*-days are ignored and
    # Dependabot silently falls back to its 3-day default), so use a flat one-week cooldown.
    cooldown:
      default-days: 7
    groups:
      actions-minor:
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: saturday
      time: "03:00"
      timezone: Asia/Tokyo
    # Cooldown applies to version updates only. Security updates skip it, but they still
    # have to pass `min-release-age` in .npmrc, which npm enforces when Dependabot
    # regenerates the lockfile: a fix version younger than that gate fails to resolve and the
    # security PR is never opened -- silently. So a security alert with no PR is the expected
    # shape here, not a sign that Dependabot is still thinking. Check for those (orphan-alerts.sh)
    # and land them by hand with `--min-release-age=0` on that one command, trading the age
    # gate for the supply-chain checks in the landing-dep-bumps skill. Do not edit .npmrc:
    # the gate does not apply to `npm ci` installs from the committed lockfile.
    #
    # Days are chosen by the bump type from the *installed* version to the candidate, so from
    # 1.2.0 both 1.3.0 and 1.3.1 count as minor. A longer minor cooldown therefore never
    # picks the patched 1.3.1 over 1.3.0 (1.3.1 is always younger); it only delays 1.3.0.
    # So keep patch and minor at the same length as the .npmrc age gate (7 days), and delay
    # majors only to leave time for peer dependencies to catch up and to plan the migration.
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      npm-development:
        dependency-type: development
        update-types:
          - minor
          - patch
      npm-production:
        dependency-type: production
        update-types:
          - patch
    ignore:
      # TypeScript 7.0 has no stable compiler API. Reconsider from 7.1 onward.
      - dependency-name: typescript
        versions:
          - 7.0.x
      # Keep Node.js types aligned with the Node 24 GitHub Actions runtime.
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
